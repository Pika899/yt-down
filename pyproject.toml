[project]
name = "ytdown"
version = "0.0.1"
description = "yt down: local web app to download YouTube videos and playlists via yt-dlp"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default]>=2026.7.4",
    "deno>=2.5",
    "imageio-ffmpeg>=0.6",
    "pywebview>=6.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
