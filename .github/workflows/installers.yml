name: Installers

# Push a tag like v1.1.0 to build, smoke-test and publish yt-down-setup.exe (Windows) and
# yt-down-mac.dmg (macOS) in one release. Run it manually (workflow_dispatch) to build and
# test without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Download uv
        run: |
          $zip = "$env:RUNNER_TEMP\uv.zip"
          Invoke-WebRequest https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath installer\bin -Force
          installer\bin\uv.exe --version

      - name: Unit tests on Windows
        run: installer\bin\uv.exe run pytest -q

      - name: Build installer
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev" }
          choco install innosetup -y --no-progress | Out-Null
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          & $iscc.FullName "/DAppVersion=$version" installer\ytdown.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item installer\Output\yt-down-setup.exe | Format-List Name, Length

      - name: Smoke test (install, app window, yt-dlp, update while open, uninstall)
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\yt down"
          $setup = (Resolve-Path installer\Output\yt-down-setup.exe).Path
          function Install { Start-Process -Wait $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`"" }
          function WaitPing($port) {
            foreach ($i in 1..90) { try { return Invoke-RestMethod "http://127.0.0.1:$port/api/ping" } catch { Start-Sleep 1 } }
            throw "yt down did not answer on port $port"
          }

          Install
          if (-not (Test-Path "$dir\.venv\Scripts\pythonw.exe")) { throw "the installer did not prepare the environment" }
          & "$dir\.venv\Scripts\python.exe" -c "from ytdown.core import tools; s = tools.status(); print(s); assert s['ytdlp'] and s['deno'] and s['ffmpeg']"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Start it the way the shortcut does: pythonw.exe, app window, no console.
          Start-Process -WorkingDirectory $dir -FilePath "$dir\.venv\Scripts\pythonw.exe" -ArgumentList '-m', 'ytdown'
          WaitPing 8765 | ConvertTo-Json -Compress
          Start-Sleep 10
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:GITHUB_WORKSPACE\windows-app.png")
          # WebView2 can be slow on its very first start: a second screenshot a bit later.
          Start-Sleep 35
          $bmp2 = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp2).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp2.Save("$env:GITHUB_WORKSPACE\windows-app-later.png")
          Write-Host "webview2 processes: $(@(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count)"
          $wv = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          Write-Host "webview2 runtime: $($wv.pv)"
          if (Test-Path "$env:USERPROFILE\.ytdown\ytdown.log") { Get-Content "$env:USERPROFILE\.ytdown\ytdown.log" -Tail 30 }
          $win = Get-Process | Where-Object { $_.MainWindowTitle -eq 'yt down' }
          Write-Host "window: $($win.ProcessName) '$($win.MainWindowTitle)'"
          if (-not $win) { throw "no 'yt down' window" }
          if (-not (Test-Path "$dir\.venv\ytdown.pid")) { throw "no pid file for the installer" }

          # A second start must bring the open window forward, not open another one.
          Start-Process -WorkingDirectory $dir -FilePath "$dir\.venv\Scripts\pythonw.exe" -ArgumentList '-m', 'ytdown'
          Start-Sleep 8
          $wins = @(Get-Process | Where-Object { $_.MainWindowTitle -eq 'yt down' })
          Write-Host "windows after second start: $($wins.Count)"
          if ($wins.Count -ne 1) { throw "second start opened $($wins.Count) windows" }

          # yt-dlp must start from the console-less app. CI IPs may be blocked by YouTube,
          # so any answer from yt-dlp (ready or a YouTube error) is fine.
          $body = @{ text = 'https://youtu.be/jNQXAC9IVRw' } | ConvertTo-Json
          Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $body http://127.0.0.1:8765/api/add | Out-Null
          foreach ($i in 1..120) {
            $s = Invoke-RestMethod http://127.0.0.1:8765/api/state
            $st = $s.items[0].state
            if ($st -in 'ready', 'failed') { break }
            Start-Sleep 1
          }
          Write-Host "analysis: $st / $($s.items[0].error)"
          if ($st -notin 'ready', 'failed') { throw "analysis did not finish" }
          if ("$($s.items[0].error)" -match 'No such file|cannot find|python') { throw "yt-dlp did not start" }

          # Update: reinstall while the app is open, then uninstall.
          Install
          if (-not (Test-Path "$dir\.venv\Scripts\pythonw.exe")) { throw "reinstalling broke the environment" }
          Start-Process -Wait "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          Start-Sleep 3
          if (Test-Path "$dir\.venv") { throw "uninstall left the environment behind" }
          Write-Host "install, window, yt-dlp, update and uninstall: OK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshot
          path: windows-app*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: yt-down-setup
          path: installer/Output/yt-down-setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        run: |
          version="0.0.0-dev"
          if [ "${{ github.ref_type }}" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; fi
          macos/build-app.sh "$version" dist
          test "$(lipo -archs "dist/yt down.app/Contents/Resources/app/bin/uv")" = "arm64"
          codesign --verify --deep --strict "dist/yt down.app"
          ls -l dist/yt-down-mac.dmg

      - name: Unit tests on macOS
        run: '"dist/yt down.app/Contents/Resources/app/bin/uv" run pytest -q'

      - name: Smoke test the app from the mounted DMG
        run: |
          # hdiutil on CI runners sometimes fails with "Resource temporarily unavailable".
          for i in 1 2 3 4 5; do hdiutil attach -nobrowse -readonly dist/yt-down-mac.dmg && break; sleep 10; done
          test -d "/Volumes/yt down"
          app="/Volumes/yt down/yt down.app"
          # First start runs the launcher: prepares the environment, then the app.
          "$app/Contents/MacOS/yt-down" --no-browser --port 8792 > engine.log 2>&1 &
          ok=""
          for i in $(seq 1 150); do
            if curl -fs -m 2 http://127.0.0.1:8792/api/ping; then ok=1; break; fi
            sleep 2
          done
          cat engine.log "$HOME/Library/Application Support/yt down/setup.log"
          test -n "$ok"
          venv="$HOME/Library/Application Support/yt down/venv"
          PYTHONPATH="$app/Contents/Resources/app/src" "$venv/bin/python" -c "from ytdown.core import tools; s = tools.status(); print(s); assert s['ytdlp'] and s['deno'] and s['ffmpeg']"
          pkill -f "python -m ytdown" || true
          sleep 2

          # Real double-click: the app window, registered as "yt down".
          open "$app"
          for i in $(seq 1 60); do curl -fs -m 2 http://127.0.0.1:8765/api/ping && break; sleep 2; done
          sleep 8
          lsappinfo list | grep -A4 '"yt down"' | tee lsappinfo.txt
          grep -q 'bundleID="app.ytdown.launcher"' lsappinfo.txt
          screencapture -x mac-app.png || true
          osascript -e 'quit app "yt down"'
          sleep 5
          if pgrep -f "python -m ytdown"; then echo "app still running after quit"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshot
          path: mac-app.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: yt-down-mac
          path: dist/yt-down-mac.dmg

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" assets/yt-down-setup.exe assets/yt-down-mac.dmg \
            --repo "${{ github.repository }}" \
            --title "yt down ${{ github.ref_name }}" \
            --notes "**Windows:** scarica \`yt-down-setup.exe\`, aprilo e segui i passaggi.
          **Mac:** scarica \`yt-down-mac.dmg\`, aprilo e trascina **yt down** in Applicazioni.
          Istruzioni complete (e cosa fare con gli avvisi di sicurezza) nel README."
